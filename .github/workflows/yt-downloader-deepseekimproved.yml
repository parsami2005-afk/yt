name: yt dl deepseek

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

      output_format:
        description: 'نوع خروجی'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      desired_quality:
        description: 'کیفیت (بسته به نوع خروجی انتخاب می‌شود)'
        required: true
        type: choice
        options:
          # Video qualities
          - 'Video: 2160p (4K)'
          - 'Video: 1440p (2K)'
          - 'Video: 1080p (Full HD)'
          - 'Video: 720p (HD)'
          - 'Video: 480p'
          - 'Video: 360p'
          - 'Video: 240p'
          - 'Video: 144p'
          # Audio qualities
          - 'Audio: 320kbps (best)'
          - 'Audio: 256kbps'
          - 'Audio: 192kbps (high)'
          - 'Audio: 128kbps (normal)'
          - 'Audio: 64kbps (low)'
          - 'Audio: 48kbps'
        default: 'Video: 720p (HD)'

      max_part_mb:
        description: 'حداکثر حجم هر قسمت (MB) - 0 = خودکار ۱۸۰۰ مگابایت'
        required: false
        type: string
        default: '90'

      always_zip:
        description: 'همیشه فایل رو زیپ کن (برای عبور از فیلتر)'
        required: true
        type: choice
        options:
          - 'Yes (zip even if small)'
          - 'No (keep as original)'
        default: 'Yes (zip even if small)'

      upload_method:
        description: '📤 روش ذخیره نهایی'
        required: true
        type: choice
        options:
          - repository (push to repo)
          - release (GitHub Releases)
        default: 'release (GitHub Releases)'

      release_tag:
        description: '🏷️ نام تگ ریلیز (فقط در صورت انتخاب Release)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  youtube-download:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip curl python3 python3-pip
          pip3 install --quiet requests

      - name: 🔗 Get Download Link
        id: retrieve
        run: |
          python3 << 'EOF'
          import os, sys, time, re, requests

          URL  = os.environ.get('INPUT_URL')
          FMT  = os.environ.get('INPUT_FORMAT')
          QUAL_CHOICE = os.environ.get('INPUT_QUALITY')

          is_audio = FMT == 'mp3'
          
          # Parse quality from the choice
          if is_audio:
              # Extract audio bitrate from selection
              if '320kbps' in QUAL_CHOICE:
                  QUAL = '320kbps'
              elif '256kbps' in QUAL_CHOICE:
                  QUAL = '256kbps'
              elif '192kbps' in QUAL_CHOICE:
                  QUAL = '192kbps'
              elif '128kbps' in QUAL_CHOICE:
                  QUAL = '128kbps'
              elif '64kbps' in QUAL_CHOICE:
                  QUAL = '64kbps'
              elif '48kbps' in QUAL_CHOICE:
                  QUAL = '48kbps'
              else:
                  QUAL = '192kbps'  # default
          else:
              # Extract video quality from selection
              if '2160p' in QUAL_CHOICE:
                  QUAL = '2160p'
              elif '1440p' in QUAL_CHOICE:
                  QUAL = '1440p'
              elif '1080p' in QUAL_CHOICE:
                  QUAL = '1080p'
              elif '720p' in QUAL_CHOICE:
                  QUAL = '720p'
              elif '480p' in QUAL_CHOICE:
                  QUAL = '480p'
              elif '360p' in QUAL_CHOICE:
                  QUAL = '360p'
              elif '240p' in QUAL_CHOICE:
                  QUAL = '240p'
              elif '144p' in QUAL_CHOICE:
                  QUAL = '144p'
              else:
                  QUAL = '720p'  # default

          payload = {
              "url": URL,
              "os": "linux",
              "output": {"type": "audio" if is_audio else "video", "format": FMT}
          }
          if is_audio:
              payload["audio"] = {"bitrate": QUAL}
          else:
              payload["output"]["quality"] = QUAL

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
          s.get("https://media.ytmp3.gg/")

          resp = s.post("https://hub.ytconvert.org/api/download", json=payload, timeout=30)
          resp.raise_for_status()
          data = resp.json()

          status_url = data.get('statusUrl')
          title = data.get('title', 'video')

          dl_url = None
          for _ in range(150):
              time.sleep(2)
              r = s.get(status_url, timeout=20)
              status = r.json()
              if status.get('status') == 'completed':
                  dl_url = status.get('downloadUrl')
                  break
              if status.get('status') == 'failed':
                  print("::error::Server failed to prepare the video")
                  sys.exit(1)

          if not dl_url:
              print("::error::Could not get download link")
              sys.exit(1)

          vid   = re.search(r'(?:v=|youtu\.be/)([a-zA-Z0-9_-]{11})', URL)[1]
          clean = re.sub(r'[^a-zA-Z0-9\-_()\[\]]', '_', title.replace(' ', '_'))
          clean = re.sub(r'_+', '_', clean).strip('_')[:70] or vid
          clean = clean.lstrip('-')
          
          # Use simplified quality name for filename
          quality_simple = QUAL.replace('kbps', '').replace('p', '')
          fname = f"{clean}_{vid}_{quality_simple}.{FMT}"

          with open(".download_info", "w", encoding="utf-8") as f:
              f.write(f"{dl_url}\n{fname}\n{title}\n{QUAL}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"filename={fname}\n")
              f.write(f"title={title}\n")
              f.write(f"quality={QUAL}\n")
          EOF
        env:
          INPUT_URL:     ${{ github.event.inputs.video_url }}
          INPUT_FORMAT:  ${{ github.event.inputs.output_format == 'mp3 (audio only)' && 'mp3' || 'mp4' }}
          INPUT_QUALITY: ${{ github.event.inputs.desired_quality }}

      - name: 📥 Download File
        id: download
        run: |
          DL_URL=$(head -1 .download_info)
          FILENAME=$(sed -n '2p' .download_info)
          mkdir -p release_files
          echo "Downloading: $FILENAME"
          curl -L --fail --progress-bar -o "release_files/$FILENAME" "$DL_URL"
          if [ ! -s "release_files/$FILENAME" ]; then
            echo "::error::Downloaded file is empty!"
            exit 1
          fi
          echo "original_filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: 📦 Process File (Split or Zip)
        id: process
        run: |
          ORIG_FILENAME="${{ steps.download.outputs.original_filename }}"
          THRESH_MB="${{ github.event.inputs.max_part_mb }}"
          ALWAYS_ZIP="${{ github.event.inputs.always_zip }}"
          
          if [[ "$THRESH_MB" -le 0 ]] || [[ "$THRESH_MB" -gt 1900 ]]; then
            THRESH_MB=1800
          fi
          
          cd release_files
          
          # Check if file exists
          if [ ! -f "$ORIG_FILENAME" ]; then
            echo "::error::File $ORIG_FILENAME not found!"
            exit 1
          fi
          
          FILESIZE=$(stat -c%s "$ORIG_FILENAME" 2>/dev/null || echo 0)
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))
          SIZE_MB=$((FILESIZE / 1024 / 1024))
          
          if [ "$FILESIZE" -gt "$THRESH_BYTES" ]; then
            # Split into multiple parts
            echo "🔪 File is ${SIZE_MB}MB - splitting into ${THRESH_MB}MB parts..."
            BASE="${ORIG_FILENAME%.*}"
            zip -r -s "${THRESH_MB}m" "${BASE}.zip" "./$ORIG_FILENAME"
            if [ $? -ne 0 ]; then
              echo "::error::Failed to split file!"
              exit 1
            fi
            rm -- "$ORIG_FILENAME"
            FINAL_FILENAME="${BASE}.zip"
            echo "✅ Created split zip: ${FINAL_FILENAME}"
          elif [ "$ALWAYS_ZIP" == "Yes (zip even if small)" ]; then
            # Just zip the single file
            echo "📦 File is ${SIZE_MB}MB - creating single zip (bypass blocks)..."
            BASE="${ORIG_FILENAME%.*}"
            zip "${BASE}.zip" "./$ORIG_FILENAME"
            if [ $? -ne 0 ]; then
              echo "::error::Failed to zip file!"
              exit 1
            fi
            rm -- "$ORIG_FILENAME"
            FINAL_FILENAME="${BASE}.zip"
            echo "✅ Created zip: ${FINAL_FILENAME}"
          else
            # Keep as is
            FINAL_FILENAME="$ORIG_FILENAME"
            echo "✅ Keeping original file: ${FINAL_FILENAME}"
          fi
          
          # Verify final file exists and has content
          if [ ! -f "$FINAL_FILENAME" ] || [ ! -s "$FINAL_FILENAME" ]; then
            echo "::error::Final file $FINAL_FILENAME is missing or empty!"
            exit 1
          fi
          
          echo "final_filename=${FINAL_FILENAME}" >> $GITHUB_OUTPUT
          cd ..
          
          # Store for later use
          echo "$FINAL_FILENAME" > .final_filename

      - name: 📅 Get Current Date
        id: get_date
        run: echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: 📤 Push to Repository
        if: github.event.inputs.upload_method == 'repository (push to repo)'
        run: |
          FINAL_FILE=$(cat .final_filename)
          
          # Check file size for repository limit
          FILESIZE=$(stat -c%s "release_files/$FINAL_FILE" 2>/dev/null || echo 0)
          SIZE_MB=$((FILESIZE / 1024 / 1024))
          
          if [ $SIZE_MB -gt 90 ]; then
            echo "::error::File is ${SIZE_MB}MB which exceeds GitHub repository limit of 100MB!"
            echo "::error::Please use 'GitHub Releases' option for files this large."
            exit 1
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p downloads
          mv release_files/* downloads/
          git add downloads/
          git commit -m "⬇️ YouTube: $FINAL_FILE [skip ci]" || echo "Nothing to commit"
          git push

      - name: 📤 Upload to GitHub Releases
        if: github.event.inputs.upload_method == 'release (GitHub Releases)'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('yt-{0}', github.run_number) }}
          name: ${{ format('YouTube - {0}', steps.retrieve.outputs.filename) }}
          body: |
            **📽️ YouTube Download**

            **Title:** ${{ steps.retrieve.outputs.title }}
            **Original Link:** ${{ github.event.inputs.video_url }}
            **Quality:** ${{ steps.retrieve.outputs.quality }}
            **Format:** ${{ github.event.inputs.output_format }}
            **Downloaded on:** ${{ steps.get_date.outputs.date }}
            **File:** $(cat .final_filename 2>/dev/null || echo "unknown")

            ---
            **Note:** If you see multiple files, download the .zip file (not "Source code"). Extract to get your video.
            
            Powered by Meli-Action ⚡
          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: 🧹 Cleanup
        if: always()
        run: rm -rf release_files .download_info .final_filename 2>/dev/null || true
